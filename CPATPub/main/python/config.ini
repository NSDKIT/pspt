# =============================================================================
# CPAT 自動解析システム 設定ファイル
# =============================================================================
# このファイルを編集することで、Pythonコードを直接変更せずに
# フォルダパスや解析条件を変更できます。
#
# 【パスの書き方】
#   Windows のフォルダパスは バックスラッシュ(\) ではなく
#   スラッシュ(/) で記述してください。
#   例: C:/CPAT_System/CPATPub/main
#
# 【相対パスについて】
#   パスを "." から始めると、このファイルが置かれているフォルダ
#   (CPATPub/main/python/) を基点とした相対パスになります。
#   例: ../  → CPATPub/main/ を指す
#       ../../ → CPATPub/ を指す
# =============================================================================

[paths]
# -----------------------------------------------------------------------
# メイン作業フォルダ（条件ファイルや系統モデルが置かれる場所）
# デフォルト: このファイルの1つ上のフォルダ (CPATPub/main/)
# -----------------------------------------------------------------------
folder_path = ..

# -----------------------------------------------------------------------
# 解析結果の一時保存先フォルダ
# デフォルト: CPATPub/main/Temp/
# -----------------------------------------------------------------------
path_to_folder = ../Temp

# -----------------------------------------------------------------------
# 条件リスト（MDLファイル）が置かれるフォルダ
# デフォルト: CPATPub/main/mdl/
# -----------------------------------------------------------------------
condition_list_folder = ../mdl

# -----------------------------------------------------------------------
# 解析条件ファイル生成スクリプト (MakeFile.py) のパス
# デフォルト: このファイルと同じフォルダ
# -----------------------------------------------------------------------
script_path = ./MakeFile.py

# -----------------------------------------------------------------------
# 解析条件 Excel ファイルのパス（自動的に上書き生成されます）
# -----------------------------------------------------------------------
excel_file_path = ./condition0.xlsx

# -----------------------------------------------------------------------
# 解析条件テンプレートが置かれるフォルダ
# デフォルト: CPATPub/main/condition/
# -----------------------------------------------------------------------
source_folder = ../condition

# -----------------------------------------------------------------------
# 解析に使用するベース系統モデル (.pop) のパス
# ※ 起動停止状態に応じて手動で変更してください
# -----------------------------------------------------------------------
source = ../mdl/EAST10peak_AllThermal_AllDemand_auto_res_SPM_R06.pop

# -----------------------------------------------------------------------
# 系統モデルのコピー先フォルダ（通常は folder_path と同じ）
# -----------------------------------------------------------------------
destination_directory = ..


[analysis]
# -----------------------------------------------------------------------
# 事故の種類
#   1 = 負荷増加 (L事故)
#   2 = 短絡⇒遮断⇒閉路 (G/O/C事故)
# -----------------------------------------------------------------------
contingency_case = 2

# -----------------------------------------------------------------------
# 事故箇所数（1 または 2）
# -----------------------------------------------------------------------
target_of_number = 1

# -----------------------------------------------------------------------
# 負荷増加量 ΔP [MW] の範囲（contingency_case = 1 のとき有効）
# ※ k1_start が 250 のときのみ ÷100 されずそのまま使われます
#   k1_start から k1_end まで delta_k1 刻みで変化させます
# -----------------------------------------------------------------------
k1_start_L = 250
k1_end_L   = 1001
delta_k1_L = 250

# -----------------------------------------------------------------------
# 短絡継続時間 [サイクル] の範囲（contingency_case = 2 のとき有効）
# ※ 内部で ÷100 されるため、サイクル数×100 で指定してください
#    例: 1〜15サイクル, 1サイクル刻み → 100, 1600, 100
# -----------------------------------------------------------------------
k1_start_GOC = 100
k1_end_GOC   = 1600
delta_k1_GOC = 100

# -----------------------------------------------------------------------
# 負荷基準値 PL_base [p.u.]
# -----------------------------------------------------------------------
PL_base = 1.89189189

# -----------------------------------------------------------------------
# 負荷有効電力・無効電力の基準値
# -----------------------------------------------------------------------
Lp_i = 1.89189189
Lq_i = 0.66824879

# -----------------------------------------------------------------------
# 組み合わせ生成のノード番号範囲（start 以上 end 以下）
# -----------------------------------------------------------------------
node_start = 11
node_end   = 47

# -----------------------------------------------------------------------
# Excel 書き込み設定
# -----------------------------------------------------------------------
sheet_name = Sheet1
start_row  = 1
start_col  = 11


[gui]
# -----------------------------------------------------------------------
# GUI 操作のタイムアウト設定 [秒]
#   ウィンドウが見つかるまで最大何秒待つか
# -----------------------------------------------------------------------
window_wait_timeout = 30

# -----------------------------------------------------------------------
# 操作間のウェイト [秒]
#   各 GUI 操作の後に入れる待機時間
# -----------------------------------------------------------------------
action_wait = 0.5

# -----------------------------------------------------------------------
# CPAT.exe の実行ファイルパス
# デフォルト: このファイルの2つ上のフォルダ (CPATPub/) にある CPAT.exe
# -----------------------------------------------------------------------
cpat_exe_path = ../../CPAT.exe
